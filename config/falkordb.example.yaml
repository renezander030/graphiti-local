server:
  transport: stdio
  host: 127.0.0.1
  port: 8000
  # streamable-http behind a reverse proxy: the Host names the SDK's DNS-rebinding
  # check accepts. Ignored by stdio.
  # allowed_hosts: [kg.example.internal:*]

graph:
  groups: [example]
  workspace_dir: ${KG_WORKSPACE_DIR:./workspace}
  # Upper bound on one graph call; kg exits 3 and an MCP tool returns an error
  # when a backend does not answer in time.
  query_timeout_seconds: 30

database:
  provider: falkordb
  falkordb:
    host: 127.0.0.1
    port: 6379
    username: null
    password: ${FALKORDB_PASSWORD:}

llm:
  model: ${KG_LLM_MODEL:gpt-4.1-mini}
  api_url: ${KG_LLM_API_URL:https://api.openai.com/v1}
  api_key: ${OPENAI_API_KEY:}
  structured_output_mode: json_schema

embedder:
  model: ${KG_EMBEDDER_MODEL:text-embedding-3-small}
  dimensions: 1536
  api_url: ${KG_EMBEDDER_API_URL:https://api.openai.com/v1}
  api_key: ${OPENAI_API_KEY:}

