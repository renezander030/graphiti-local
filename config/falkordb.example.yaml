server:
  transport: stdio
  host: 127.0.0.1
  port: 8000
  # streamable-http behind a reverse proxy: the Host names the SDK's DNS-rebinding
  # check accepts. Ignored by stdio.
  # allowed_hosts: [kg.example.internal:*]
  # For streamable-http, bind each bearer token to the groups it may read. Keep old
  # and new tokens together during rotation. An empty groups list grants all groups.
  # auth:
  #   tokens:
  #     - name: primary
  #       token: ${KG_MCP_TOKEN:}
  #       groups: [example]

graph:
  groups: [example]
  workspace_dir: ${KG_WORKSPACE_DIR:./workspace}
  # Upper bound on one graph call; kg exits 3 and an MCP tool returns an error
  # when a backend does not answer in time.
  query_timeout_seconds: 30
  writer_lock_timeout_seconds: 30
  ingest_max_attempts: 3
  ingest_retry_base_seconds: 1

database:
  provider: falkordb
  falkordb:
    host: 127.0.0.1
    port: 6379
    username: null
    password: ${FALKORDB_PASSWORD:}

llm:
  model: ${KG_LLM_MODEL:gpt-4.1-mini}
  api_url: ${KG_LLM_API_URL:https://api.openai.com/v1}
  api_key: ${OPENAI_API_KEY:}
  structured_output_mode: json_schema
  # auto uses Responses on the official OpenAI endpoint and Chat Completions elsewhere.
  api_mode: auto
  # Hard ceiling for every extraction call, including larger upstream prompt requests.
  max_tokens: 4096
  require_all_schema_properties: true

embedder:
  model: ${KG_EMBEDDER_MODEL:text-embedding-3-small}
  dimensions: 1536
  api_url: ${KG_EMBEDDER_API_URL:https://api.openai.com/v1}
  api_key: ${OPENAI_API_KEY:}

reranker:
  provider: passthrough
  candidate_multiplier: 3
  min_score: 0
